name: Build APK

# Produces the APKs that get sideloaded.
#
# Two channels, both updatable:
#   debug   - always built, no secrets needed. Signed with the committed debug key, so every
#             build from any machine updates the last. Installs as "FixoraX (Debug)".
#   release - built only once the RELEASE_KEYSTORE_BASE64 secret exists. Signed with the private
#             key, and the channel intended for real distribution.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release that carries the APK

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # versionCode is the commit count, so a shallow clone would compute a smaller number
          # than the previous build. Android refuses to install a lower versionCode, which would
          # break exactly the update path this workflow exists to guarantee.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building version 1.0.$VERSION_CODE (versionCode $VERSION_CODE)"

      - name: Refuse a version that would move backwards
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          # versionCode is the commit count. A build from a branch with fewer commits, or from a
          # shallow clone, would compute a lower number than an already-published release — and
          # Android refuses to install a lower versionCode over a higher one, permanently breaking
          # the update path for anyone who installed the higher build. Equal is allowed: re-running
          # the same commit republishes the same tag.
          HIGHEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | sed -n 's/^v[0-9]\+\.[0-9]\+\.\([0-9]\+\)$/\1/p' \
            | sort -n | tail -1)
          HIGHEST=${HIGHEST:-0}
          echo "Building versionCode $VERSION_CODE; highest published is $HIGHEST"
          if [ "$VERSION_CODE" -lt "$HIGHEST" ]; then
            echo "::error::versionCode $VERSION_CODE is lower than the published $HIGHEST." \
                 "Android would refuse this as an update. Check that the checkout is not shallow" \
                 "and that this branch is not behind the one the last release was built from."
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Decode release keystore
        id: keystore
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "path=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect and verify APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION="${{ steps.version.outputs.name }}"

          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$DEBUG_APK" "dist/fixhora-$VERSION-debug.apk"

          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
            cp "$RELEASE_APK" "dist/fixhora-$VERSION.apk"
          fi

          # An unsigned APK installs nowhere, so failing here beats publishing one.
          for apk in dist/*.apk; do
            echo "--- $apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk"
          done

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixhora-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            SIGNING_NOTE="Signed with the project release key."
          else
            SIGNING_NOTE="Debug-signed build. The release key is not configured yet — see README."
          fi

          NOTES=$(cat <<EOF
          Version $VERSION (versionCode $VERSION_CODE)

          Download the .apk below on your phone and open it to install.

          $SIGNING_NOTE

          This installs straight over any earlier build of the same channel — they share one
          signing key. If Android says "App not installed", you still have a build from before
          the application id changed to \`com.fixhora.app\`; uninstall it once and this will work.

          From 1.0.15 onwards you only need to do this by hand once: the app checks this page
          itself and offers the update in-app.

          Commit: ${{ github.sha }}
          EOF
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            # --target pins the tag to the built commit. Without it the tag is created on the
            # default branch, so every tag shares one commit date — and the releases API orders
            # "latest" by that date, which the in-app updater would then have to guess around.
            gh release create "$TAG" dist/*.apk \
              --target "$GITHUB_SHA" \
              --title "Fixhora $VERSION" \
              --notes "$NOTES"
          fi
