name: Build signed APK

# Produces the APK that gets sideloaded. Every APK from this workflow is signed with the same key
# held in repository secrets, which is what lets each new build install over the previous one.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write # needed to publish the release that carries the APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # versionCode is derived from the commit count, so a shallow clone would compute a
          # smaller number than the previous build. Android refuses to install a lower
          # versionCode, which would break exactly the update path this workflow exists to
          # guarantee.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Decode signing keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            echo "::error::Run ./scripts/make-release-keystore.sh and add the four secrets it prints."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "path=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Read version
        id: version
        run: |
          VERSION_CODE=$(git rev-list --count HEAD)
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "name=1.0.$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Verify the APK is actually signed
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Built: $APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # An unsigned APK installs nowhere, so failing here is better than publishing one.
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          echo "apk=$APK" >> "$GITHUB_ENV"

      - name: Rename APK
        run: |
          mkdir -p dist
          cp "$apk" "dist/fixhora-${{ steps.version.outputs.name }}.apk"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fixhora-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          NOTES=$(printf '%s\n' \
            "Version ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})" \
            "" \
            "Download the .apk below on your phone and open it to install." \
            "" \
            "This build installs straight over any earlier release from this workflow — they all" \
            "share one signing key. If Android says \"App not installed\", you still have the old" \
            "pre-release build (a different application id); uninstall it once and this will work." \
            "" \
            "Commit: ${{ github.sha }}")
          gh release create "$TAG" "dist/fixhora-${{ steps.version.outputs.name }}.apk" \
            --title "Fixhora ${{ steps.version.outputs.name }}" \
            --notes "$NOTES" \
            || gh release upload "$TAG" "dist/fixhora-${{ steps.version.outputs.name }}.apk" --clobber
